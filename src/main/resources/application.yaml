spring:
  application:
    name: rag-sync-service
  datasource:
    url: jdbc:h2:mem:rag_sync;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080

rag-sync:
  api-token: local-dev-token
  worker:
    enabled: true
    fixed-delay-ms: 5000
    batch-size: 10
  defaults:
    default-branch: master
    docs-path-regex: '^docs/.*\\.md$'
    rag-collection: default
